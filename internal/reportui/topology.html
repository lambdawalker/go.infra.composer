<section class="tab-panel topology-panel" id="topology-panel" role="tabpanel" aria-labelledby="topology-tab" tabindex="0" hidden>
          <div class="topology-toolbar">
            <button type="button" id="topology-icon-settings" class="topology-settings-button" aria-label="Icon settings" title="Icon settings" aria-haspopup="dialog" aria-controls="topology-icon-dialog" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m10 3 .5-1h3l.5 2 2 .9 2-.5 1.6 2.6-1.4 1.6.2 2.2 1.6 1.3-.7 2.9-2.2.4-1.4 1.7.1 2.2-2.8 1.2-1.5-1.6-2.2-.2-1.7 1.3-2.5-1.6.6-2.2-.9-2-2.1-.6v-3l2-.7.9-2-.6-2 2.5-1.7 1.8 1.3 2-.4Z"/><circle cx="12" cy="11.5" r="3.1"/></svg></button>
            <label class="topology-switch"><input type="checkbox" role="switch" id="topology-arrows" checked> Arrows</label><label class="topology-switch"><input type="checkbox" role="switch" id="topology-focus" checked> Selection focus</label>
            <label class="topology-slider">Platform opacity <input type="range" aria-label="Platform opacity" id="topology-opacity" min="0" max="100" step=".25" value="4.75"><output for="topology-opacity">4.75%</output></label>
            <label class="topology-slider" title="50 restores the original glass finish">Icon glass transparency <input type="range" aria-label="Icon glass transparency" id="topology-glass" min="0" max="100" value="50"><output for="topology-glass">50%</output></label>
            <label class="topology-switch"><input type="checkbox" id="topology-changes"> Changes only</label>
            <label>Trace <select id="topology-trace"><option value="">Off</option><option value="out">Depends on</option><option value="in">Used by</option></select></label>
            <button type="button" id="topology-frame" title="Frame selection (F)">Frame selection</button><button type="button" id="topology-branch" hidden>Collapse branch</button><button type="button" id="topology-fit">Fit view</button></div>
          <dialog id="topology-icon-dialog" class="topology-icon-dialog" aria-labelledby="topology-icon-title">
            <header><h2 id="topology-icon-title">Icon settings</h2><form method="dialog"><button type="submit" aria-label="Close icon settings">Close</button></form></header>
            <table aria-labelledby="topology-icon-title"><thead><tr><th scope="col">Artifact</th><th scope="col">3D icon</th></tr></thead><tbody id="topology-icon-rows"></tbody></table>
          </dialog>
          <div class="topology-stage" id="topology-stage" role="group" tabindex="0" aria-label="3D artifact topology. Arrow keys orbit, plus and minus zoom, Ctrl+B starts box zoom, and Home resets the view. Select artifacts from the list below."><canvas id="topology-canvas" aria-hidden="true"></canvas>
            <div class="topology-navigation" id="topology-navigation" role="group" aria-label="Viewport navigation" hidden>
              <div class="topology-axes" id="topology-axes" role="group" aria-label="Axis views"></div>
              <div class="topology-nav-tools">
                <button type="button" data-nav="pan" title="Pan" aria-label="Pan" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6c0 4-2 6-6 6h-1c-2 0-4-1-5-3l-4-6a1.5 1.5 0 0 1 2-2l2 2Z"/></svg></button>
                <button type="button" data-nav="in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6m-3-3v6"/></svg></button>
                <button type="button" data-nav="out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6"/></svg></button>
                <button type="button" data-nav="box" title="Box zoom (Ctrl+B)" aria-label="Box zoom (Ctrl+B)" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/><circle cx="11" cy="11" r="3"/><path d="m13.5 13.5 3 3"/></svg></button>
                <button type="button" data-nav="home" title="Reset to original view (Home)" aria-label="Reset to original view (Home)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M6 9v11h12V9m-8 11v-7h4v7"/></svg></button>
              </div>
            </div>
            <div class="topology-box" id="topology-box" hidden></div>
            <div class="topology-tooltip" id="topology-tooltip" hidden></div><p class="topology-message" id="topology-message">Select the deployment target to view its artifacts.</p><div id="topology-labels" aria-hidden="true"></div><div class="topology-selected" id="topology-selected" aria-live="polite" hidden></div></div>
          <div id="topology-relationship" aria-live="polite" hidden></div>
          <div class="topology-legend" aria-label="Topology legend"><span><i class="topology-key glass"></i> AWS service models</span><span><i class="topology-key component"></i> Component group</span><span><i class="topology-key membership" aria-hidden="true"></i> Pulumi parent → child</span><span><i class="topology-key attachment" aria-hidden="true"></i> AWS attachment</span><span><i class="topology-key selected"></i> Selected artifact</span></div>
          <div class="topology-list-head"><h3>Artifacts <span id="topology-count">0</span></h3><input id="topology-search" type="search" placeholder="Find an artifact" aria-label="Find an artifact in topology"></div>
          <ol class="topology-list" id="topology-list" aria-label="Artifact topology in text form"></ol>
        </section>
