name: Go validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/infra-compose
      - run: go build ./cmd/infra-nuke

  pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/pulumi
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: adapters/pulumi/go.mod
          cache-dependency-path: adapters/pulumi/go.sum
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...

  deploycli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: deploycli
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: deploycli/go.mod
          cache-dependency-path: deploycli/go.sum
      - run: node --test internal/wizardweb/ui/aws-icons.test.js internal/wizardweb/ui/topology.test.js internal/wizardweb/ui/model-assets.test.js
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/infra-deploy

  awsdiscovery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/awsdiscovery
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: adapters/awsdiscovery/go.mod
          cache-dependency-path: adapters/awsdiscovery/go.sum
      - run: go mod verify
      - run: go test -race -p=2 ./...
      - run: go vet -p=2 ./...
      - run: go build -o "$RUNNER_TEMP/discovery-registry" ./cmd/registry
